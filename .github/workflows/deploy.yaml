name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  check:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - name: Basic check
         run: |
           test -f README.md
           echo "Basic check passed"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run:  |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts
      - name: Run deploy script on VM
        run: |
         ssh $ {{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "bash /path/to/deploy.sh"
